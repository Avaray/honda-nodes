name: Publish to Comfy Registry

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  check-version:
    name: Check if version is new
    runs-on: ubuntu-latest
    outputs:
      is_new_version: ${{ steps.version_check.outputs.is_new_version }}
      version: ${{ steps.version_check.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Read local version from pyproject.toml
        id: version_check
        run: |
          LOCAL_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Local version: $LOCAL_VERSION"
          echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

          PACKAGE_NAME=$(grep '^name' pyproject.toml | head -1 | sed 's/name = "\(.*\)"/\1/')
          PUBLISHER_ID=$(grep 'PublisherId' pyproject.toml | head -1 | sed 's/PublisherId = "\(.*\)"/\1/')
          echo "Package: $PUBLISHER_ID/$PACKAGE_NAME"

          REGISTRY_URL="https://registry.comfy.org/nodes/${PUBLISHER_ID}/${PACKAGE_NAME}"
          REGISTRY_RESPONSE=$(curl -s --max-time 10 "$REGISTRY_URL" || echo "")

          REGISTRY_VERSION=$(echo "$REGISTRY_RESPONSE" | grep -oP '"latest_version"\s*:\s*"\K[^"]+' | head -1 || echo "")

          if [ -z "$REGISTRY_VERSION" ]; then
            echo "Could not fetch registry version (first publish or API error). Proceeding."
            echo "is_new_version=true" >> $GITHUB_OUTPUT
          elif [ "$LOCAL_VERSION" = "$REGISTRY_VERSION" ]; then
            echo "Version $LOCAL_VERSION is already published. Skipping."
            echo "is_new_version=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: $LOCAL_VERSION (registry has $REGISTRY_VERSION)"
            echo "is_new_version=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish to registry
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.is_new_version == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
